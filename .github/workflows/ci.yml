name: ci

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    name: ci
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && (vars.CI_RUNNER_PUBLIC || 'ubuntu-24.04') || 'ubuntu-24.04' }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4 # the Bun inside stock OpenCode 2.4.1
          # The runner's Bun cache restores outside ~/.bun and leaves no executable; download Bun each run instead.
          no-cache: true
      # actionlint parses the workflows as workflows, not as YAML: a `${{ }}` in a context that does not exist makes
      # GitHub reject the file and run nothing at all.
      - name: actionlint
        run: |
          set -euo pipefail
          version=1.7.12
          base="https://github.com/rhysd/actionlint/releases/download/v${version}"
          curl -sSfLO "${base}/actionlint_${version}_linux_amd64.tar.gz"
          curl -sSfLO "${base}/actionlint_${version}_checksums.txt"
          grep " actionlint_${version}_linux_amd64.tar.gz$" "actionlint_${version}_checksums.txt" | sha256sum -c -
          tar xzf "actionlint_${version}_linux_amd64.tar.gz" actionlint
          ./actionlint -color
      - run: npm ci --ignore-scripts
      - run: npm run check
